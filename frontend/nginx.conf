# 前端 nginx 站点配置
#   1) SPA 路由：所有非文件请求回退到 /index.html（否则刷新 /dashboard 会 404）
#   2) /api 反向代理到后端容器 app:8000（容器内部 DNS，不需要 host.docker.internal）
#   3) gzip 压缩静态资源，减少传输体积
#   4) 静态资源长缓存（assets/ 带 hash）
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # -------------------- gzip --------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # -------------------- 静态资源长缓存 --------------------
    # Vite 产物的 assets/ 带 hash 后缀：一年缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------- /api 反代到后端 --------------------
    # 容器内直接用 compose 服务名 "app" 访问后端 8000
    # 将 X-Forwarded-* 头透传给后端，方便 CORS 与日志获取真实 IP
    location /api/ {
        proxy_pass         http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 文件上传允许大体积（10MB 与后端 MAX_UPLOAD_SIZE 一致）
        client_max_body_size 20m;
    }

    # -------------------- SPA 路由回退 --------------------
    # 非真实存在的文件/目录请求统一交给 index.html 由 vue-router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止隐藏文件访问
    location ~ /\.(?!well-known) {
        deny all;
    }
}
