# 前端 nginx 站点配置
#   1) SPA 路由：所有非文件请求回退到 /index.html（否则刷新 /dashboard 会 404）
#   2) /api 反向代理到后端容器 app:8000（容器内部 DNS，不需要 host.docker.internal）
#   3) gzip 压缩静态资源，减少传输体积
#   4) 静态资源长缓存（assets/ 带 hash）
#   5) brotli 压缩（如 Nginx 未编译 brotli 模块会自动忽略）
#   6) DNS 预解析 + index.html 不缓存
server {
    listen       80;
    http2        on;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;

    # -------------------- DNS Prefetch Control --------------------
    add_header X-DNS-Prefetch-Control "on";

    # -------------------- gzip --------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # -------------------- brotli --------------------
    # 注意：若 Nginx 编译时未带 ngx_brotli 模块，以下指令会被自动忽略
    # 可通过 nginx -V 2>&1 | grep brotli 检查是否支持
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml
    #     application/rss+xml
    #     image/svg+xml
    #     font/ttf
    #     font/woff
    #     font/woff2;

    # -------------------- index.html（不缓存 + preload 提示）--------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Link preload 示例：实际部署时可将 xxx 替换为构建出的真实 hash
        # add_header Link '</assets/js/index-xxx.js>; rel=preload; as=script, </assets/css/index-xxx.css>; rel=preload; as=style';
        try_files $uri =404;
    }

    # -------------------- 静态资源长缓存 --------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------- sw.js & manifest.json（中等缓存）--------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.json {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -------------------- /api 反代到后端 --------------------
    location /api/ {
        proxy_pass         http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200m;
    }

    # -------------------- SPA 路由回退 --------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止隐藏文件访问
    location ~ /\.(?!well-known) {
        deny all;
    }
}
